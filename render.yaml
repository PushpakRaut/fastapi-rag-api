# Render Blueprint: free web service, no credit card needed.
# Hosted version uses Google Gemini's free tier through its OpenAI-compatible API, with embeddings for hybrid search.
services:
  - type: web
    name: pushpak-fastapi-rag
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_API_KEY             # free key from aistudio.google.com
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.5-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIMENSIONS
        value: "768"
      - key: CLIENT_IP_HEADER        # Render sits behind Cloudflare, which sets this and overwrites any client value
        value: cf-connecting-ip
      - key: SECURE_COOKIES
        value: "true"
